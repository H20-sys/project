<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>MaintAI : client web</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 520px; margin: 40px auto; padding: 0 16px; }
  label { display: block; margin-top: 12px; }
  input { width: 100%; padding: 6px; box-sizing: border-box; }
  button { margin-top: 16px; padding: 8px 16px; }
  #result { margin-top: 20px; padding: 12px; border-radius: 6px; }
  .ok { background: #e6f4ea; } .alert { background: #fde7e7; } .err { background: #fff4e5; }
</style>
</head>
<body>
<h1>MaintAI</h1>
<label>URL de l'API <input id="url" value="http://localhost:8000"></label>
<label>Clé API <input id="key" type="password"></label>
<label>Température (°C) <input id="temperature_c" type="number" step="0.1" value="72"></label>
<label>Vibration (mm/s) <input id="vibration_mm_s" type="number" step="0.1" value="6"></label>
<label>Charge (%) <input id="load_pct" type="number" step="1" value="85"></label>
<label>Heures de fonctionnement <input id="runtime_hours" type="number" step="100" value="15000"></label>
<button id="go">Prédire</button>
<div id="result"></div>
<script>
const FEATURES = ["temperature_c", "vibration_mm_s", "load_pct", "runtime_hours"];
const show = (cls, text) => {
  const r = document.getElementById("result");
  r.className = cls;
  r.textContent = text;
};

document.getElementById("go").addEventListener("click", async () => {
  // Champ vide -> null : l'API répond 422, au lieu de prédire avec 0 sans prévenir (Number("") vaut 0)
  const reading = Object.fromEntries(FEATURES.map(f => {
    const v = document.getElementById(f).value;
    return [f, v === "" ? null : Number(v)];
  }));
  const adresse = document.getElementById("url").value.replace(/\/+$/, "") + "/v1/predict";
  const cle = document.getElementById("key").value;
  try {
    const resp = await fetch(adresse, {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-API-Key": cle },
      body: JSON.stringify(reading),  // l'objet devient du texte JSON
    });
    const data = await resp.json().catch(() => ({ detail: resp.statusText }));
    if (!resp.ok) {
      // 401 (clé), 422 (relevé refusé), 503 (modèle absent) : le code et l'explication de l'API
      const detail = Array.isArray(data.detail)
        ? data.detail.map(d => `${d.loc.at(-1)} : ${d.msg}`).join(" ; ")
        : data.detail;
      show("err", `Erreur ${resp.status} : ${detail}`);
      return;
    }
    const pct = (data.failure_probability * 100).toFixed(1);
    const seuil = Math.round(data.threshold * 100);
    if (data.alert) show("alert", `ALERTE : probabilité de panne ${pct} % (seuil ${seuil} %)`);
    else show("ok", `Pas d'alerte : probabilité de panne ${pct} % (seuil ${seuil} %)`);
  } catch (e) {
    // Pas de réponse lisible : l'API est arrêtée, ou CORS bloque cette origine
    show("err", `API injoignable (arrêtée, ou origine refusée par CORS) : ${e.message}`);
  }
});
</script>
</body>
</html>
